<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="./img/8_coin/coin_1.png" sizes="32x32">

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/coin-status-bar.class.js"></script>
    <script src="./models/bottle-status-bar.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js"></script>

</head>

<body>
    <h1>El Pollo Loco</h1>

    <div class="startscreen">
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <div class="startscreen-container">
            <div class="left-panel">
                <div class="game-badge">
                    <div class="badge-glow"></div>
                    <span class="badge-text">2026 EDITION</span>
                </div>

                <div class="logo-section">
                    <div class="logo-wrapper">
                        <div class="title-container">
                            <h2 class="game-title">
                                <span class="title-word">EL</span>
                                <span class="title-word">POLLO</span>
                                <span class="title-word">LOCO</span>
                            </h2>
                        </div>
                        <img src="img/2_character_pepe/2_walk/W-21.png" alt="Pepe" class="pepe-image">
                    </div>
                    <div class="title-underline"></div>
                </div>

                <div class="game-stats">
                    <div class="stat-item">
                        <div class="stat-icon">🎮</div>
                        <div class="stat-info">
                            <span class="stat-label">Genre</span>
                            <span class="stat-value">Action Adventure</span>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon">⚔️</div>
                        <div class="stat-info">
                            <span class="stat-label">Difficulty</span>
                            <span class="stat-value">Challenging</span>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon">🏆</div>
                        <div class="stat-info">
                            <span class="stat-label">Mission</span>
                            <span class="stat-value">Defeat Boss</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="menu-header">
                    <h3>MAIN MENU</h3>
                    <div class="menu-line"></div>
                </div>

                <div class="game-menu">
                    <button type="button" class="menu-btn btn-play" id="startBtn">
                        <span class="btn-bg"></span>
                        <span class="btn-content">
                            <span class="btn-icon">▶</span>
                            <span class="btn-text">PLAY NOW</span>
                        </span>
                        <span class="btn-shine"></span>
                    </button>

                    <button type="button" class="menu-btn btn-instructions" id="instructionsBtn">
                        <span class="btn-bg"></span>
                        <span class="btn-content">
                            <span class="btn-icon">📋</span>
                            <span class="btn-text">HOW TO PLAY</span>
                        </span>
                    </button>

                    <button type="button" class="menu-btn btn-settings" id="settingsBtn">
                        <span class="btn-bg"></span>
                        <span class="btn-content">
                            <span class="btn-icon">⚙️</span>
                            <span class="btn-text">SETTINGS</span>
                        </span>
                    </button>
                </div>

                <div class="version-info">
                    <span class="version-text">Version 0.5.5 BETA</span>
                    <div class="status-indicator">
                        <span class="status-dot"></span>
                        <span class="status-text">READY</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="instructionsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Instructions</h2>
                <button class="close-btn" id="closeInstructions">&times;</button>
            </div>
            <div class="modal-body">
                <h3>Key Bindings</h3>
                <div class="key-bindings">
                    <div class="key-group">
                        <div class="key-item">
                            <span class="key">A</span>
                            <span class="action">Move Left</span>
                        </div>
                        <div class="key-item">
                            <span class="key">D</span>
                            <span class="action">Move Right</span>
                        </div>
                    </div>
                    <div class="key-group">
                        <div class="key-item">
                            <span class="key">SPACE</span>
                            <span class="action">Jump</span>
                        </div>
                        <div class="key-item">
                            <span class="key">F</span>
                            <span class="action">Throw Bottle</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" id="closeSettings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <label for="volumeSlider">Volume</label>
                    <div class="volume-control">
                        <span class="volume-icon">🔊</span>
                        <input type="range" id="volumeSlider" min="0" max="100" value="50">
                        <span class="volume-value" id="volumeValue">50%</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label>Display Mode</label>
                    <div class="display-controls">
                        <button type="button" class="display-btn active" id="normalModeBtn">Normal</button>
                        <button type="button" class="display-btn" id="fullscreenModeBtn">Fullscreen</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

</body>

</html>
