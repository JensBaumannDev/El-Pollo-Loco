<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="./img/8_coin/coin_1.png" sizes="32x32">

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/collectableBottle.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/coin-status-bar.class.js"></script>
    <script src="./models/bottle-status-bar.class.js"></script>
    <script src="./models/endboss-status-bar.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js"></script>

</head>

<body>

    <div class="startscreen">
        <div class="screen-background"></div>
        <div class="screen-content">
            <div class="title-container">
                <h2 class="startscreen-title">EL POLLO LOCO</h2>
                <p class="subtitle">Catch the Chickens!</p>
            </div>
            <div class="game-menu">
                <button type="button" class="btn btn-primary" id="startBtn">
                    <span class="btn-icon">▶</span>
                    <span class="btn-text">PLAY NOW</span>
                </button>
                <button type="button" class="btn btn-secondary" id="instructionsBtn">
                    <span class="btn-icon">?</span>
                    <span class="btn-text">HOW TO PLAY</span>
                </button>
                <button type="button" class="btn btn-secondary" id="settingsBtn">
                    <span class="btn-icon">⚙</span>
                    <span class="btn-text">SETTINGS</span>
                </button>
            </div>
        </div>
    </div>

    <div class="modal" id="instructionsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>HOW TO PLAY</h2>
                <button class="close-btn" id="closeInstructions">&times;</button>
            </div>
            <div class="modal-body">
                <h3>Key Bindings</h3>
                <div class="key-bindings">
                    <div class="key-group">
                        <div class="key-item">
                            <span class="key">A</span>
                            <span class="action">Move Left</span>
                        </div>
                        <div class="key-item">
                            <span class="key">D</span>
                            <span class="action">Move Right</span>
                        </div>
                    </div>
                    <div class="key-group">
                        <div class="key-item">
                            <span class="key">SPACE</span>
                            <span class="action">Jump</span>
                        </div>
                        <div class="key-item">
                            <span class="key">F</span>
                            <span class="action">Throw Bottle</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" id="closeSettings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <label for="volumeSlider">Volume</label>
                    <div class="volume-control">
                        <span class="volume-icon">🔊</span>
                        <input type="range" id="volumeSlider" min="0" max="100" value="40">
                        <span class="volume-value" id="volumeValue">40%</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label>Display Mode</label>
                    <div class="display-controls">
                        <button type="button" class="display-btn active" id="normalModeBtn">Normal</button>
                        <button type="button" class="display-btn" id="fullscreenModeBtn">Fullscreen</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="game-container" id="gameContainer" style="display: none;">
        <canvas id="canvas"></canvas>
        <div class="game-ui" id="gameUI">
            <button class="game-ui-btn" id="gameMuteBtn" title="Mute" tabindex="-1">🔊</button>
            <button class="game-ui-btn" id="gameSettingsBtn" title="Settings">⚙</button>
            <button class="game-ui-btn" id="gameInstructionsBtn" title="Instructions">?</button>
        </div>
    </div>

    <div class="endscreen" id="endscreen">
        <div class="screen-background"></div>
        <div class="screen-content">
            <div class="endimage-container">
                <img id="endimage" src="" alt="Game End">
            </div>
            <div class="game-menu">
                <button type="button" class="btn btn-primary" id="restartBtn">
                    <span class="btn-icon">🔄</span>
                    <span class="btn-text">ERNEUT SPIELEN</span>
                </button>
                <button type="button" class="btn btn-secondary" id="quitBtn">
                    <span class="btn-icon">⏹</span>
                    <span class="btn-text">BEENDEN</span>
                </button>
            </div>
        </div>
    </div>

</body>

</html>
